name: app_geo
description: "Application de tracking GPS avec export/import GPX."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # GPS / Location
  geolocator: ^13.0.4
  permission_handler: ^11.3.1

  # Map (OpenStreetMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # GPX parsing / generation
  gpx: ^2.3.0

  # Files / Storage / Sharing
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  file_picker: ^8.1.4

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
